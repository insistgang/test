<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的第一个页面</title>
    <style>
        body {
            font-family: "Microsoft YaHei", sans-serif;
            max-width: 600px;
            margin: 60px auto;
            padding: 0 20px;
            color: #333;
            background: #f5f7fa;
        }
        h1 { color: #2c5ecb; }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            background: #2c5ecb;
            color: #fff;
            cursor: pointer;
        }
        button:hover { background: #1f49a3; }
    </style>
</head>
<body>
    <h1>你好，世界！</h1>
    <p>这是一个简单的 HTML 页面。</p>
    <button onclick="sayHello()">点我试试</button>

    <script>
        function sayHello() {
            alert("你好！欢迎访问我的页面 😊");
        }
    </script>
</body>
</html>
